name: atualizar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar canais ao vivo
        run: python atualizar.py
      - name: Gerar filmes e series (sem teste, foco nos canais)
        run: python atualizar_filmes.py
      - name: Publicar (commit unico)
        run: |
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "sem mudancas, nada a publicar"
            exit 0
          fi
          MSG="atualizacao $(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "$MSG"
          git checkout --orphan squash
          git add -A
          git commit -m "$MSG"
          git branch -D main
          git branch -m main
          git push -f origin main
